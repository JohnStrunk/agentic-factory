name: CI

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run automated test suite
        run: |
          echo "Running automated test suite (placeholder - to be defined by project)..."
          exit 0

  lint-markdown:
    name: Lint Markdown Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: "**/*.md"

  lint-yaml-and-workflows:
    name: Lint YAML Configurations and Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: Run yamllint
        run: |
          pipx run yamllint .


  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # master

  successful-ci:
    name: Successful CI
    needs:
      - test
      - lint-markdown
      - lint-yaml-and-workflows
      - lint-shell
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate aggregate prerequisite conclusions
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "CI verification failed: one or more prerequisite jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "CI verification passed: all prerequisite test and lint check jobs succeeded."
          exit 0
